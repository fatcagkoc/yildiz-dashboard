name: Verileri guncelle ve yayinla

on:
  schedule:
    # Saatler UTC: 07:20-15:20 UTC = 10:20-18:20 Istanbul, hafta ici
    - cron: "20 7-15 * * 1-5"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore: ["data.json"]

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: pip install requests websocket-client

      - name: Verileri cek
        continue-on-error: true
        run: python fetch_data.py

      - name: data.json kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          if ! git diff --staged --quiet; then
            git commit -m "Veri guncellemesi $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase --autostash || true
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
