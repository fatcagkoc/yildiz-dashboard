name: Verileri guncelle ve yayinla

on:
  workflow_dispatch:
    inputs:
      test_report:
        description: "Gun sonu raporunu simdi TEST olarak e-postayla gonder"
        type: boolean
        default: false
  push:
    branches: [main]
    paths-ignore: ["data.json"]

concurrency:
  group: update
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Always the newest commit on main (not the commit from the moment the run was triggered),
      # so a run that waited in the queue sees what the previous run saved (e.g. "report sent today").
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Paketleri kur
        run: pip install requests websocket-client

      - name: Verileri cek
        continue-on-error: true
        run: python fetch_data.py

      # Second guard against a double e-mail: read the latest "sent today" record right before the report step.
      - name: Son rapor durumunu al
        continue-on-error: true
        run: |
          git fetch --depth=1 origin main
          git checkout FETCH_HEAD -- report_state.json 2>/dev/null || true
          cat report_state.json 2>/dev/null || echo "report_state.json yok"

      - name: Gun sonu raporu
        continue-on-error: true
        env:
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          REPORT_TEST: ${{ inputs.test_report }}
        run: python report.py

      - name: data.json kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          [ -f rapor.html ] && git add rapor.html
          [ -f report_state.json ] && git add report_state.json
          if ! git diff --staged --quiet; then
            git commit -m "Veri guncellemesi $(date -u +'%Y-%m-%d %H:%M') UTC"
            # if another run pushed in the meantime, keep this run's (newer) files and retry
            for i in 1 2 3; do
              if git pull --rebase -X theirs && git push; then break; fi
              git rebase --abort 2>/dev/null || true
              sleep 5
            done
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
